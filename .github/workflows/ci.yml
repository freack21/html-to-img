name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build --tag html-to-img:ci .

  # Deploys only after tests pass on main. Turn off Coolify's own auto-deploy on push,
  # otherwise every push to main is deployed twice (and untested).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_DEPLOY_WEBHOOK / COOLIFY_TOKEN secrets are not set; skipping deploy."
            exit 0
          fi
          status=$(curl --silent --show-error --max-time 30 --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --output response.json --write-out '%{http_code}' \
            "$COOLIFY_DEPLOY_WEBHOOK") || { echo "::error::Could not reach Coolify. Check the host in COOLIFY_DEPLOY_WEBHOOK."; exit 1; }
          cat response.json; echo
          case "$status" in
            2??) ;;
            401) echo "::error::Coolify rejected COOLIFY_TOKEN (401). Create a new token with the deploy permission and update the secret."; exit 1 ;;
            403) echo "::error::Coolify refused the request (403). Enable API access and check Allowed IPs in Settings > Advanced; the token needs the deploy permission."; exit 1 ;;
            404) echo "::error::Coolify has no application with the uuid in COOLIFY_DEPLOY_WEBHOOK (404). If the app was re-created or moved, copy the new Deploy Webhook from the application's Webhooks page into the secret."; exit 1 ;;
            *) echo "::error::Coolify answered HTTP $status."; exit 1 ;;
          esac
